name: Fork Image (GHCR + TCR)

# Fork-private image build, dual-pushed to:
#   - ghcr.io/blueskyxn/octop                  (public archive)
#   - ccr.ccs.tencentyun.com/xn-cn-gz/octop     (Tencent TCR personal, Guangzhou —
#     the registry the production server pulls from; first push is a ~2GB
#     cross-border upload, re-runs only upload missing layers)
# Lives ONLY on the fork/image branch — never part of upstream PRs.
# Differs from upstream docker-publish.yml: no Docker Hub login/secrets,
# one version tag only (e.g. 1.0.0.2). Compose pins that tag.
# TCR push requires repo secrets TCR_USERNAME / TCR_PASSWORD (TCR 访问凭证).
#
# Trigger: push an img-v* tag placed on a fork/image commit. The img- prefix
# keeps upstream's v*-triggered workflows (Release / Docker Publish / Desktop)
# out of the way — they fire only on tags starting with "v".
#   git tag img-v1.0.0-feishu.2 && git push origin img-v1.0.0-feishu.2
on:
  push:
    tags:
      - "img-v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push image (GHCR + TCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag ref
        id: ver
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            img-v*)
              echo "version=${ref#img-v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Expected refs/tags/img-v*, got ref_name=$ref"
              exit 1
              ;;
          esac

      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to TCR (Guangzhou)
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TCR gets its own step: the US runner -> Guangzhou first push (~2GB,
      # cross-border) can stall, and an isolated step turns a stall into a
      # re-runnable failure ("Re-run failed jobs" resumes it). TCR dedupes
      # blobs by digest, so every retry uploads only what is still missing
      # and retries converge. The rebuild itself hits the GHA layer cache.
      - name: Push (TCR Guangzhou)
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ccr.ccs.tencentyun.com/xn-cn-gz/octop:${{ steps.ver.outputs.version }}
          cache-from: type=gha
