name: Fork Image (GHCR + TCR)

# Fork-private image build, pushed to:
#   - ghcr.io/blueskyxn/octop                      (public archive)
#   - uswccr.ccs.tencentyun.com/us-sv/octop        (Tencent TCR personal,
#     Silicon Valley — same country as the runner, so the 2GB first push is
#     fast; US runners CANNOT push bytes into the Guangzhou endpoint:
#     verified 2026-09-15, 30 min at 0 bytes while logins/GETs work)
# The production server then relays us-sv -> xn-cn-gz (Guangzhou) over the
# Tencent internal network and pulls from xn-cn-gz.
# Lives ONLY on the fork/image branch — never part of upstream PRs.
# Differs from upstream docker-publish.yml: no Docker Hub login/secrets,
# one version tag only (e.g. 1.0.0.2). Compose pins that tag.
# TCR push requires repo secrets TCR_USERNAME / TCR_PASSWORD (TCR 访问凭证).
#
# Trigger: push an img-v* tag placed on a fork/image commit. The img- prefix
# keeps upstream's v*-triggered workflows (Release / Docker Publish / Desktop)
# out of the way — they fire only on tags starting with "v".
#   git tag img-v1.0.0-feishu.2 && git push origin img-v1.0.0-feishu.2
on:
  push:
    tags:
      - "img-v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push image (GHCR + TCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag ref
        id: ver
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            img-v*)
              echo "version=${ref#img-v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Expected refs/tags/img-v*, got ref_name=$ref"
              exit 1
              ;;
          esac

      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to TCR (us-sv)
        uses: docker/login-action@v3
        with:
          registry: uswccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TCR gets its own step so a registry problem never redoes the build.
      # Target is us-sv (Silicon Valley): same country as the runner. Do NOT
      # point this at the Guangzhou endpoint — US runners hang on its blob
      # uploads (0 bytes in 30 min, 2026-09-15). The server relays us-sv to
      # xn-cn-gz over the Tencent internal network.
      - name: Push (TCR us-sv)
        uses: docker/build-push-action@v6
        timeout-minutes: 20
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: uswccr.ccs.tencentyun.com/us-sv/octop:${{ steps.ver.outputs.version }}
          cache-from: type=gha
