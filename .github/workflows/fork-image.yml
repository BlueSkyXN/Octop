name: Fork Image (GHCR only)

# Fork-private image build for ghcr.io/blueskyxn/octop.
# Lives ONLY on the fork/image branch — never part of upstream PRs.
# Differs from upstream docker-publish.yml: no Docker Hub login/secrets,
# one version tag only (e.g. 1.0.0.1). Compose pins that tag.
#
# Trigger: push an img-v* tag placed on a fork/image commit. The img- prefix
# keeps upstream's v*-triggered workflows (Release / Docker Publish / Desktop)
# out of the way — they fire only on tags starting with "v".
#   git tag img-v1.0.0-feishu.2 && git push origin img-v1.0.0-feishu.2
on:
  push:
    tags:
      - "img-v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag ref
        id: ver
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            img-v*)
              echo "version=${ref#img-v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Expected refs/tags/img-v*, got ref_name=$ref"
              exit 1
              ;;
          esac

      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
